<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NexEnergy – Licitaciones Energéticas</title>
<style>
:root{
  --dark:#252530;--dark2:#1d1d27;--dark3:#323244;
  --teal:#1a9e5c;--teal2:#147a46;--teal3:#3dbb7a;
  --orange:#d46e3a;--bg:#f0f3f6;--surface:#fff;
  --border:#dde4ea;--t1:#252530;--t2:#3d3d4f;--t3:#737380;--t4:#aaaabc;
  --green:#0fa06a;--red:#d63b3b;--yellow:#e6a817;--blue:#3a7bd5;
  --sidebar-w:240px;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,sans-serif;}
body{background:var(--bg);color:var(--t1);}

/* ── LOGIN ── */
#login-screen{position:fixed;inset:0;background:linear-gradient(135deg,var(--dark2) 0%,var(--dark) 50%,#3a2456 100%);display:flex;align-items:center;justify-content:center;z-index:9999;}
.login-box{background:var(--surface);border-radius:16px;padding:40px;width:380px;box-shadow:0 20px 60px rgba(0,0,0,.4);}
.login-logo{text-align:center;margin-bottom:28px;}
.login-logo .brand{font-size:26px;font-weight:800;color:var(--teal);letter-spacing:-0.5px;}
.login-logo .sub{font-size:12px;color:var(--t4);margin-top:2px;}
.login-box h2{font-size:18px;color:var(--t1);margin-bottom:20px;text-align:center;}
.form-field{margin-bottom:14px;}
.form-field label{display:block;font-size:12px;font-weight:600;color:var(--t3);margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px;}
.form-field input{width:100%;border:1.5px solid var(--border);border-radius:8px;padding:10px 12px;font-size:14px;color:var(--t1);outline:none;transition:border .2s;}
.form-field input:focus{border-color:var(--teal);}
.btn-login{width:100%;background:var(--teal);color:#fff;border:none;border-radius:8px;padding:12px;font-size:15px;font-weight:700;cursor:pointer;margin-top:6px;transition:background .2s;}
.btn-login:hover{background:var(--teal2);}
.login-err{color:var(--red);font-size:13px;text-align:center;min-height:18px;margin-top:8px;}
.quick-access{margin-top:22px;border-top:1px solid var(--border);padding-top:20px;}
.quick-access-label{font-size:10px;color:var(--t4);text-align:center;margin-bottom:14px;text-transform:uppercase;letter-spacing:1px;font-weight:600;}
.quick-btns{display:flex;gap:10px;}
.quick-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:16px 10px 14px;border:1.5px solid var(--border);background:var(--surface);border-radius:12px;cursor:pointer;transition:all .2s;text-align:center;position:relative;overflow:hidden;min-width:0;}
.quick-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.08);}
.quick-btn-icon{font-size:28px;line-height:1;}
.quick-btn-role{font-size:12px;font-weight:800;white-space:nowrap;}
.quick-btn-desc{font-size:10px;color:var(--t4);font-weight:500;white-space:nowrap;}
.quick-btn.qb-admin{border-color:rgba(26,158,92,.25);}
.quick-btn.qb-admin:hover{border-color:var(--teal);background:#f0fdf4;}
.quick-btn.qb-admin .quick-btn-role{color:var(--teal);}
.quick-btn.qb-eval{border-color:rgba(230,168,23,.25);}
.quick-btn.qb-eval:hover{border-color:var(--yellow);background:#fffbf0;}
.quick-btn.qb-eval .quick-btn-role{color:#b07d00;}
.quick-btn.qb-post{border-color:rgba(15,160,106,.25);}
.quick-btn.qb-post:hover{border-color:var(--green);background:#f0faf6;}
.quick-btn.qb-post .quick-btn-role{color:var(--green);}

/* ── APP SHELL ── */
#app{display:none;min-height:100vh;}
#app.visible{display:flex;}

/* ── SIDEBAR ── */
.sidebar{width:var(--sidebar-w);background:var(--dark);min-height:100vh;display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;z-index:100;}
.sidebar-header{padding:20px 16px 16px;border-bottom:1px solid rgba(255,255,255,.07);}
.sidebar-brand{font-size:20px;font-weight:800;color:#fff;letter-spacing:-0.5px;}
.sidebar-brand span{color:var(--teal3);}
.sidebar-sub{font-size:11px;color:rgba(255,255,255,.35);margin-top:2px;}
.sidebar-role{margin-top:10px;display:inline-block;background:var(--teal);color:#fff;font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.5px;}
.sidebar-role.rol-evaluador{background:var(--orange);}
.sidebar-role.rol-postulante{background:var(--green);}

.sidebar-nav{flex:1;padding:12px 0;overflow-y:auto;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 16px;cursor:pointer;color:rgba(255,255,255,.55);font-size:13.5px;font-weight:500;border-left:3px solid transparent;transition:all .2s;}
.nav-item:hover{color:#fff;background:rgba(255,255,255,.05);}
.nav-item.active{color:#fff;background:rgba(26,158,92,.15);border-left-color:var(--teal3);}
.nav-item .icon{font-size:16px;width:20px;text-align:center;}

.sidebar-footer{padding:16px;border-top:1px solid rgba(255,255,255,.07);}
.user-info{display:flex;align-items:center;gap:10px;}
.user-avatar{width:34px;height:34px;border-radius:50%;background:var(--teal);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;flex-shrink:0;}
.user-name{font-size:13px;font-weight:600;color:rgba(255,255,255,.85);}
.user-email{font-size:11px;color:rgba(255,255,255,.35);}
.btn-logout{margin-top:12px;width:100%;padding:8px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:7px;color:rgba(255,255,255,.5);font-size:12px;cursor:pointer;transition:all .2s;}
.btn-logout:hover{background:rgba(214,59,59,.15);border-color:rgba(214,59,59,.3);color:#ff7b7b;}

/* ── MAIN ── */
.main{margin-left:var(--sidebar-w);flex:1;min-height:100vh;display:flex;flex-direction:column;}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 28px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;}
.topbar-title{font-size:17px;font-weight:700;color:var(--t1);}
.topbar-right{display:flex;align-items:center;gap:12px;}
.badge-notif{background:var(--teal);color:#fff;font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;}
.content{padding:28px;flex:1;}

/* ── STATS CARDS ── */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px;margin-bottom:24px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;position:relative;overflow:hidden;}
.stat-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:var(--accent,var(--teal));}
.stat-card .stat-label{font-size:11px;color:var(--t3);font-weight:700;text-transform:uppercase;letter-spacing:.5px;}
.stat-card .stat-val{font-size:34px;font-weight:800;color:var(--t1);margin:6px 0 2px;line-height:1;}
.stat-card .stat-sub{font-size:12px;color:var(--t4);}
.stat-card .stat-icon{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:30px;opacity:.1;}

/* ── SECTION CARD ── */
.section-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:22px;margin-bottom:20px;}
.section-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.section-hdr h3{font-size:15px;font-weight:700;color:var(--t1);}
.sec-badge{font-size:11px;font-weight:700;background:#f0f3f6;color:var(--t3);padding:3px 8px;border-radius:20px;}

/* ── TABLE ── */
.tbl{width:100%;border-collapse:collapse;font-size:13px;}
.tbl th{background:#f8f9fb;color:var(--t3);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.4px;padding:10px 12px;text-align:left;border-bottom:1px solid var(--border);}
.tbl td{padding:11px 12px;border-bottom:1px solid #f0f3f6;color:var(--t2);vertical-align:middle;}
.tbl tr:last-child td{border-bottom:none;}
.tbl tr:hover td{background:#fafbfc;}

/* ── BADGES ── */
.badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;}
.badge-pendiente{background:#fff3e0;color:#e65100;}
.badge-evaluacion{background:#e3f2fd;color:#1565c0;}
.badge-evaluado{background:#e8f5e9;color:#2e7d32;}
.badge-aprobado{background:#e8f5e9;color:#2e7d32;}
.badge-rechazado{background:#ffebee;color:#c62828;}
.badge-activo{background:rgba(15,160,106,.12);color:var(--green);}
.badge-proximo{background:rgba(58,123,213,.12);color:var(--blue);}
.badge-cerrado{background:#f5f5f5;color:var(--t4);}

/* ── SCORE BAR ── */
.score-bar-wrap{display:flex;align-items:center;gap:8px;}
.score-bar{flex:1;height:7px;background:#eef0f6;border-radius:4px;overflow:hidden;}
.score-bar-fill{height:100%;border-radius:4px;}
.score-num{font-size:12px;font-weight:700;min-width:32px;text-align:right;}

/* ── DONUT ── */
.donut-wrap{display:flex;align-items:center;gap:24px;flex-wrap:wrap;}
.donut-svg{width:140px;height:140px;flex-shrink:0;}
.donut-legend{display:flex;flex-direction:column;gap:10px;}
.legend-item{display:flex;align-items:center;gap:8px;font-size:13px;}
.legend-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;}

/* ── TIMELINE ── */
.timeline{display:flex;flex-direction:column;gap:0;}
.tl-item{display:flex;gap:12px;padding:10px 0;position:relative;}
.tl-item:not(:last-child)::after{content:'';position:absolute;left:15px;top:36px;bottom:-4px;width:1px;background:var(--border);}
.tl-dot{width:30px;height:30px;border-radius:50%;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;z-index:1;}
.tl-dot.green{background:var(--green);}
.tl-dot.orange{background:var(--orange);}
.tl-dot.blue{background:var(--blue);}
.tl-body{flex:1;}
.tl-title{font-size:13px;font-weight:600;color:var(--t1);}
.tl-desc{font-size:12px;color:var(--t3);margin-top:2px;}
.tl-time{font-size:11px;color:var(--t4);margin-top:2px;}

/* ── TWO COL ── */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px;}
@media(max-width:900px){.two-col{grid-template-columns:1fr;}}

/* ── FORMS ── */
.field-group{margin-bottom:16px;}
.field-group label{display:block;font-size:12px;font-weight:700;color:var(--t3);margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px;}
.field-group input,.field-group textarea,.field-group select{width:100%;border:1.5px solid var(--border);border-radius:8px;padding:10px 12px;font-size:14px;color:var(--t1);outline:none;transition:border .2s;background:var(--surface);}
.field-group input:focus,.field-group textarea:focus,.field-group select:focus{border-color:var(--teal);}
.field-group textarea{resize:vertical;min-height:80px;}
.btn{padding:10px 18px;border-radius:8px;border:none;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:6px;}
.btn-primary{background:var(--teal);color:#fff;}
.btn-primary:hover{background:var(--teal2);}
.btn-secondary{background:var(--bg);border:1.5px solid var(--border);color:var(--t2);}
.btn-secondary:hover{border-color:var(--teal);color:var(--teal);}
.btn-danger{background:var(--red);color:#fff;}
.btn-sm{padding:6px 12px;font-size:12px;}
.btn-ai{background:linear-gradient(135deg,#0a6030,#1a9e5c);color:#fff;}
.btn-ai:hover{background:linear-gradient(135deg,#064e3b,#147a46);}

/* ── EVAL ── */
.eval-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:16px;overflow:hidden;}
.eval-card-hdr{background:#f8f9fb;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);}
.eval-card-hdr h4{font-size:14px;font-weight:700;color:var(--t1);}
.eval-card-body{padding:18px;}
.criterion-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.criterion-name{flex:1;font-size:13px;font-weight:500;color:var(--t2);}
.criterion-input{width:78px;border:1.5px solid var(--border);border-radius:8px;padding:7px 10px;font-size:14px;font-weight:700;color:var(--t1);text-align:center;outline:none;}
.criterion-input:focus{border-color:var(--teal);}
.criterion-max{font-size:11px;color:var(--t4);white-space:nowrap;}
.ai-sug-btn{font-size:11px;color:#15803d;background:#f0fdf4;padding:3px 8px;border-radius:6px;cursor:pointer;border:1px solid #bbf7d0;white-space:nowrap;}
.ai-sug-btn:hover{background:#dcfce7;}

/* ── AI PANEL ── */
.ai-panel{background:linear-gradient(135deg,#f5f3ff,#faf0ff);border:1px solid #bbf7d0;border-radius:12px;padding:18px;margin-top:16px;}
.ai-panel h4{font-size:13px;font-weight:700;color:#15803d;margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.ai-result{font-size:13px;color:var(--t2);line-height:1.6;white-space:pre-wrap;}

/* ── STATUS BANNER ── */
.status-banner{border-radius:10px;padding:14px 18px;margin-bottom:20px;display:flex;align-items:center;gap:12px;font-size:14px;}
.status-banner.warn{background:#fff8e1;border:1px solid #ffe082;color:#6d4c00;}
.status-banner.ok{background:#e8f5e9;border:1px solid #a5d6a7;color:#1b5e20;}
.status-banner.info{background:#e3f2fd;border:1px solid #90caf9;color:#1a237e;}

/* ── RANK NUM ── */
.rank-num{width:28px;height:28px;border-radius:50%;background:var(--teal);color:#fff;font-size:12px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;}
.rank-num.gold{background:#f59e0b;}
.rank-num.silver{background:#9ca3af;}
.rank-num.bronze{background:#b45309;}

/* ── PROGRESS ── */
.progress-bar{height:8px;background:#eef0f6;border-radius:4px;overflow:hidden;margin-top:4px;}
.progress-fill{height:100%;border-radius:4px;background:var(--teal);}

/* ── STEPPER HORIZONTAL ── */
.stepper{display:flex;align-items:flex-start;gap:0;margin:24px 0 8px;position:relative;}
.step-item{flex:1;display:flex;flex-direction:column;align-items:center;position:relative;z-index:1;}
.step-item:not(:last-child)::after{content:'';position:absolute;top:22px;left:calc(50% + 22px);right:calc(-50% + 22px);height:3px;background:var(--border);z-index:0;transition:background .4s;}
.step-item.done:not(:last-child)::after{background:var(--green);}
.step-item.active:not(:last-child)::after{background:linear-gradient(to right,var(--teal),var(--border));}
.step-dot{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;border:3px solid var(--border);background:var(--surface);position:relative;z-index:2;transition:all .3s;}
.step-item.done .step-dot{background:var(--green);border-color:var(--green);color:#fff;}
.step-item.active .step-dot{background:var(--teal);border-color:var(--teal);color:#fff;box-shadow:0 0 0 6px rgba(26,158,92,.15);}
.step-item.pending .step-dot{background:var(--surface);border-color:var(--border);color:var(--t4);}
.step-label{margin-top:10px;text-align:center;font-size:12px;font-weight:700;color:var(--t3);}
.step-item.done .step-label{color:var(--green);}
.step-item.active .step-label{color:var(--teal);}
.step-sublabel{text-align:center;font-size:11px;color:var(--t4);margin-top:2px;max-width:90px;}
.step-item.active .step-sublabel{color:var(--t3);}

/* ── POSTULACIÓN STATUS CARD ── */
.post-status-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;margin-bottom:16px;}
.post-status-card-hero{padding:20px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;}
.post-status-card-info{flex:1;}
.post-status-card-title{font-size:16px;font-weight:800;color:var(--t1);margin-bottom:3px;}
.post-status-card-sub{font-size:12px;color:var(--t4);}
.post-status-card-score{text-align:right;flex-shrink:0;}
.post-status-card-steps{padding:0 24px 24px;border-top:1px solid var(--border);}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;display:none;align-items:center;justify-content:center;padding:16px;}
.modal-overlay.open{display:flex;}
.modal{background:var(--surface);border-radius:14px;width:620px;max-width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.35);}
.modal-hdr{padding:20px 24px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--surface);z-index:1;}
.modal-hdr h3{font-size:16px;font-weight:700;}
.modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--t4);line-height:1;padding:4px;}
.modal-close:hover{color:var(--t1);}
.modal-body{padding:24px;}
.modal-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;position:sticky;bottom:0;background:var(--surface);}

/* ── EMPTY STATE ── */
.empty-state{text-align:center;padding:48px 24px;color:var(--t4);}
.empty-state .icon{font-size:40px;margin-bottom:12px;}
.empty-state p{font-size:14px;}

/* ── ALERT ── */
.alert{padding:12px 16px;border-radius:8px;font-size:13px;margin-bottom:14px;display:flex;align-items:flex-start;gap:8px;line-height:1.4;}
.alert-warn{background:#fff8e1;border:1px solid #ffe082;color:#6d4c00;}
.alert-info{background:#e3f2fd;border:1px solid #90caf9;color:#1a237e;}
.alert-success{background:#e8f5e9;border:1px solid #a5d6a7;color:#1b5e20;}

/* ── CONFIG ── */
.config-section{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:22px;margin-bottom:16px;}
.config-section h4{font-size:14px;font-weight:700;color:var(--t1);margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border);}
.range-row{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
.range-row label{flex:1;font-size:13px;color:var(--t2);}
.range-row input[type=range]{flex:2;accent-color:var(--teal);}
.range-val{font-weight:700;color:var(--teal);min-width:30px;text-align:right;font-size:14px;}

/* ── CHIP ── */
.chip{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;border:1px solid;}
.chip-purple{border-color:#bbf7d0;background:#f0fdf4;color:#15803d;}

/* ── CONCURSO CARDS GRID ── */
.concurso-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px;margin-top:4px;}
.conc-card{background:var(--surface);border-radius:16px;overflow:hidden;border:1px solid var(--border);transition:transform .2s,box-shadow .2s;display:flex;flex-direction:column;}
.conc-card:hover{transform:translateY(-3px);box-shadow:0 12px 40px rgba(0,0,0,.1);}
.conc-card-hero{height:150px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;}
.conc-card-hero::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.05),rgba(0,0,0,.35));}
.conc-card-hero-icon{font-size:64px;line-height:1;position:relative;z-index:1;filter:drop-shadow(0 4px 12px rgba(0,0,0,.3));}
.conc-card-status{position:absolute;top:12px;right:12px;z-index:2;font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;letter-spacing:.3px;}
.conc-card-status.activo{background:rgba(15,160,106,.9);color:#fff;}
.conc-card-status.cerrado{background:rgba(0,0,0,.5);color:rgba(255,255,255,.8);}
.conc-card-status.proximo{background:rgba(58,123,213,.9);color:#fff;}
.conc-card-cat{position:absolute;top:12px;left:12px;z-index:2;font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;background:rgba(255,255,255,.2);color:#fff;letter-spacing:.3px;backdrop-filter:blur(4px);}
.conc-card-ya{position:absolute;bottom:10px;left:12px;z-index:2;font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;background:rgba(15,160,106,.95);color:#fff;}
.conc-card-body{padding:18px;flex:1;display:flex;flex-direction:column;}
.conc-card-title{font-size:15px;font-weight:800;color:var(--t1);line-height:1.3;margin-bottom:6px;}
.conc-card-desc{font-size:12px;color:var(--t3);line-height:1.5;margin-bottom:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}

(function loadFB(){
  const sdks=[
    'https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js',
    'https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js',
    'https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js'
  ];
  let n=0;
  sdks.forEach(src=>{
    const s=document.createElement('script');
    s.src=src;
    s.onload=s.onerror=()=>{ if(++n===sdks.length) connectFB(); };
    document.head.appendChild(s);
  });
})();

function connectFB(){
  try{
    if(!firebase.apps.length) firebase.initializeApp(FB_CFG);
    _db=firebase.database();
    try{
      _auth=firebase.auth();
      _auth.onAuthStateChanged(u=>{ if(!_session&&u) bootApp(); });
    }catch(e){_auth=null;}
  }catch(e){_db=null;}
}

function doLogin(){
  const email=document.getElementById('lg-email').value.trim();
  const pass=document.getElementById('lg-pass').value;
  const demo=Object.values(DEMO).find(s=>s.email===email&&s.pass===pass);
  if(demo){_setSession(demo);bootApp();return;}
  document.getElementById('lg-err').textContent='Credenciales incorrectas.';
}

function demoLogin(key){
  const s=DEMO[key];if(!s)return;
  _setSession(s);bootApp();
}

function _setSession(s){
  _session={...s};
  try{sessionStorage.setItem('cc_s',JSON.stringify(s));}catch(e){}
}

function doLogout(){
  _session=null;
  try{sessionStorage.removeItem('cc_s');}catch(e){}
  if(_auth)try{_auth.signOut();}catch(e){}
  document.getElementById('app').style.display='none';
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('lg-err').textContent='';
  document.getElementById('lg-pass').value='';
}

(function restoreSession(){
  try{

})();

function subscribeFB(){
  // Siempre cargar seed inmediatamente para render inicial
  _allConcs=JSON.parse(JSON.stringify(SEED_CONCS));
  _allPosts=JSON.parse(JSON.stringify(SEED_POSTS));
  _settings=JSON.parse(JSON.stringify(SEED_SETTINGS));
  renderView(_activeNav);

  // Firebase puede sobreescribir si tiene datos reales
  if(!_db)return;
  try{
    _db.ref(`${DB_PATH}/postulaciones`).on('value',snap=>{
      const v=snap.val();
      if(v&&Object.keys(v).length>0){_allPosts=v;renderView(_activeNav);}
    });
    _db.ref(`${DB_PATH}/concursos`).on('value',snap=>{
      const v=snap.val();
      if(v&&Object.keys(v).length>0){_allConcs=v;renderView(_activeNav);}
    });
    _db.ref(`${DB_PATH}/settings`).once('value').then(snap=>{
      const v=snap.val();
      if(v)_settings=v;
    }).catch(()=>{});
  }catch(e){}
}

function useSeed(){
  _allConcs=JSON.parse(JSON.stringify(SEED_CONCS));
  _allPosts=JSON.parse(JSON.stringify(SEED_POSTS));
  _settings=JSON.parse(JSON.stringify(SEED_SETTINGS));
  renderView(_activeNav);
}

function estadoBadge(e){

function fmtDate(ts){if(!ts)return'–';return new Date(ts).toLocaleDateString('es-CL',{day:'2-digit',month:'short',year:'numeric'});}
function fmtMoney(n){return'$'+Number(n).toLocaleString('es-CL');}
function ago(ts){const d=Math.floor((Date.now()-ts)/864e5);return d===0?'Hoy':d===1?'Ayer':`Hace ${d} días`;}
function scoreColor(s){if(s>=85)return'var(--green)';if(s>=70)return'var(--teal)';if(s>=50)return'var(--yellow)';return'var(--red)';}

function donutSVG(data){
  const total=data.reduce((s,d)=>s+d.value,0);
  if(!total)return'<svg width="140" height="140" viewBox="0 0 140 140"><circle cx="70" cy="70" r="50" fill="none" stroke="#eee" stroke-width="20"/><text x="70" y="74" text-anchor="middle" font-size="14" fill="var(--t4)">Sin datos</text></svg>';
  const r=50,cx=70,cy=70,circ=2*Math.PI*r;
  let offset=0,paths='';
  data.forEach(d=>{
    const dash=(d.value/total)*circ,gap=circ-dash;
    paths+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${d.color}" stroke-width="20" stroke-dasharray="${dash.toFixed(1)} ${gap.toFixed(1)}" stroke-dashoffset="${(-(offset/total)*circ).toFixed(1)}" transform="rotate(-90 ${cx} ${cy})"/>`;
    offset+=d.value;
  });
  return`<svg viewBox="0 0 140 140" class="donut-svg">${paths}<text x="70" y="66" text-anchor="middle" font-size="22" font-weight="800" fill="var(--t1)">${total}</text><text x="70" y="82" text-anchor="middle" font-size="11" fill="var(--t3)">total</text></svg>`;
}

function saveApiKey(){
  const k=document.getElementById('cfg-apikey')?.value?.trim();
  if(!k)return;
  _settings.api_key=k;
  if(_db)_db.ref(`${DB_PATH}/settings/api_key`).set(k);
  toast('API Key guardada ✅');
}

async function testGeminiKey(){
  const k=document.getElementById('cfg-apikey')?.value?.trim()||_settings?.api_key||'';
  if(!k){toast('Ingresa una API Key primero','warn');return;}
  toast('Probando conexión con Gemini…');
  try{
    const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${k}`,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({contents:[{role:'user',parts:[{text:'Responde solo: OK'}]}],generationConfig:{maxOutputTokens:5}})
    });
    const j=await r.json();
    if(j.error)toast('❌ '+j.error.message,'warn');
    else toast('✅ Gemini conectado correctamente');
  }catch(e){toast('❌ Error: '+e.message,'warn');}
}

function saveRankingParams(){
  const p=document.getElementById('cfg-params')?.value;
  const c=document.getElementById('cfg-ctx')?.value;
  _settings.ranking_params=p;_settings.ranking_ctx=c;
  if(_db){
    _db.ref(`${DB_PATH}/settings/ranking_params`).set(p);
    _db.ref(`${DB_PATH}/settings/ranking_ctx`).set(c);
  }
  toast('Parámetros guardados ✅');
}

      <div style="height:5px;background:${th.grad}"></div>

        <button class="btn btn-secondary btn-sm" onclick="openDetalle('${p.id}')">Ver detalle</button>
      </div>
    </div>`;
  }).join('');

  const emptyF=filtered.length===0?`<div class="empty-state" style="padding:36px"><div class="icon">🔍</div><p>Sin evaluaciones en esta categoría.</p></div>`:'';

  return`
<div style="display:flex;gap:14px;margin-bottom:22px;flex-wrap:wrap">

// ══════════════════════════════════════
const CONC_THEME={
  "conc001":{grad:"linear-gradient(135deg,#064e3b,#047857,#1a9e5c)",icon:"⚡"},
  "conc002":{grad:"linear-gradient(135deg,#713f12,#b45309,#fbbf24)",icon:"☀️"},
  "conc003":{grad:"linear-gradient(135deg,#1e3a5f,#1d4ed8,#60a5fa)",icon:"🏫"},
  "conc004":{grad:"linear-gradient(135deg,#164e63,#0891b2,#22d3ee)",icon:"📊"},
  "conc005":{grad:"linear-gradient(135deg,#3d1a00,#b45309,#f97316)",icon:"🏨"},
  "conc006":{grad:"linear-gradient(135deg,#1e1b4b,#4338ca,#818cf8)",icon:"🛒"},
  "conc007":{grad:"linear-gradient(135deg,#1c1917,#44403c,#a8a29e)",icon:"⛏️"}
};
const DEFAULT_THEME={grad:"linear-gradient(135deg,#374151,#6b7280)",icon:"📋"};

// ══════════════════════════════════════
//  POSTULANTE: CONCURSOS DISPONIBLES
// ══════════════════════════════════════
function vConcursosPost(){
  const all=concs();
  const misPost=posts().filter(p=>p.postulante_uid===_session.uid);
  const yaPostule=id=>misPost.some(p=>p.concurso_id===id);
  const activos=all.filter(c=>c.estado==='activo').length;

  const cards=all.map(c=>{
    const yp=yaPostule(c.id);
    const abierto=c.estado==='activo';
    const th=CONC_THEME[c.id]||DEFAULT_THEME;
    const numPosts=posts().filter(p=>p.concurso_id===c.id).length;
    const statusLabel={activo:'Activo',cerrado:'Cerrado','próximo':'Próximo'}[c.estado]||c.estado;
    const statusCls={activo:'activo',cerrado:'cerrado','próximo':'proximo'}[c.estado]||'cerrado';

    let cta='';
    if(yp){
      cta=`<button class="btn-postular ya-postulado" onclick="navTo('mi-postulacion')">✅ Ya postulaste</button>`;
    } else if(abierto){
      cta=`<button class="btn-postular" onclick="abrirFormulario('${c.id}')">Postular →</button>`;
    } else {
      cta=`<button class="btn-postular" disabled>${c.estado==='próximo'?'Próximamente':'Cerrado'}</button>`;
    }

    return`<div class="conc-card">
      <div class="conc-card-hero" style="background:${th.grad}">
        <span class="conc-card-hero-icon">${th.icon}</span>
        <span class="conc-card-cat">${c.categoria||'Concurso'}</span>
        <span class="conc-card-status ${statusCls}">${statusLabel}</span>
        ${yp?`<span class="conc-card-ya">✓ Postulaste</span>`:''}
      </div>
      <div class="conc-card-body">
        <div class="conc-card-title">${c.titulo}</div>
        <div class="conc-card-desc">${c.descripcion}</div>
        <div class="conc-card-stats">
          <div class="conc-stat"><span class="conc-stat-label">Monto máx.</span><span class="conc-stat-val">${fmtMoney(c.monto_max)}</span></div>
          <div class="conc-stat"><span class="conc-stat-label">Cierre</span><span class="conc-stat-val">${c.fecha_cierre}</span></div>
          <div class="conc-stat"><span class="conc-stat-label">Postulaciones</span><span class="conc-stat-val">${numPosts}</span></div>
        </div>
        <div class="conc-card-footer">
          <span class="conc-card-posts">${c.criterios?c.criterios.length+' criterios':''}</span>
          ${cta}
        </div>
      </div>
    </div>`;
  }).join('');

  return`
<div style="margin-bottom:22px;display:flex;align-items:flex-end;justify-content:space-between">
  <div>
    <div style="font-size:20px;font-weight:800;color:var(--t1);margin-bottom:3px">Concursos Disponibles</div>
    <div style="font-size:13px;color:var(--t3)">${all.length} concursos · <span style="color:var(--green);font-weight:600">${activos} abiertos</span> para postulación</div>
  </div>
</div>
<div class="concurso-grid">${cards}</div>`;
}

// ══════════════════════════════════════
//  POSTULANTE: ESTADO
// ══════════════════════════════════════
function vEstado(){
  const mine=posts().filter(p=>p.postulante_uid===_session.uid);
  if(!mine.length)return`<div class="empty-state" style="padding:60px">
    <div class="icon">🔎</div>
    <p style="font-size:15px;font-weight:600;margin-bottom:8px">Sin postulaciones registradas</p>
    <button class="btn btn-primary" style="margin-top:12px" onclick="navTo('concursos-post')">🏆 Ver concursos disponibles</button>
  </div>`;

  const stepsDef=[
    {key:'enviado',   icon:'📨', label:'Enviada',       sublabel:'Recibida'},
    {key:'revision',  icon:'🔍', label:'En Revisión',   sublabel:'Verificación'},
    {key:'evaluacion',icon:'⚖️', label:'Evaluación',    sublabel:'Panel evaluador'},
    {key:'resultado', icon:'🏆', label:'Resultado',      sublabel:'Comunicación'},
  ];

  function getStepState(key, p){
    const ev=Object.values(p.evaluaciones||{})[0];
    switch(key){
      case'enviado':   return{cls:'done',  sub:fmtDate(p.enviado_en)};
      case'revision':  return p.estado==='pendiente'?{cls:'active',sub:'En espera'}:{cls:'done',sub:'Completado'};
      case'evaluacion':return p.estado==='evaluado'?{cls:'done',sub:'Completado'}:p.estado==='en_evaluacion'?{cls:'active',sub:'En proceso'}:{cls:'pending',sub:'Pendiente'};
      case'resultado': return p.estado==='evaluado'?{cls:'done',sub:ev?fmtDate(ev.fecha):'Listo'}:{cls:'pending',sub:'Pendiente'};
    }
  }

  function pctBar(p){
    if(p.estado==='pendiente') return 5;
    if(p.estado==='en_evaluacion') return 65;
    if(p.estado==='evaluado') return 100;
    return 15;
  }

  const statCounts={
    todas:mine.length,
    pendiente:mine.filter(p=>p.estado==='pendiente').length,
    en_evaluacion:mine.filter(p=>p.estado==='en_evaluacion').length,
    evaluado:mine.filter(p=>p.estado==='evaluado').length,
  };
  const statFiltros=[
    {key:'todas',      label:'Todas',         icon:'📋'},
    {key:'pendiente',  label:'Pendientes',    icon:'⏳'},
    {key:'en_evaluacion',label:'En Evaluación',icon:'🔍'},
    {key:'evaluado',   label:'Evaluadas',     icon:'✅'},
  ];
  const estadoFilterBar=`<div class="filter-bar">
    ${statFiltros.map(f=>`<button class="filter-chip${_estadoFiltro===f.key?' active':''}" onclick="setEstadoFiltro('${f.key}')">
      ${f.icon} ${f.label}<span class="chip-count">${statCounts[f.key]}</span>
    </button>`).join('')}
  </div>`;

  const filteredMine=_estadoFiltro==='todas'?mine:mine.filter(p=>p.estado===_estadoFiltro);

  const cards=filteredMine.map(p=>{
    const conc=_allConcs[p.concurso_id];
    const th=CONC_THEME[p.concurso_id]||DEFAULT_THEME;
    const ev=Object.values(p.evaluaciones||{})[0];
    const pct=pctBar(p);

    const stepHtml=stepsDef.map(s=>{
      const st=getStepState(s.key,p);
      return`<div class="step-item ${st.cls}">
        <div class="step-dot">${st.cls==='done'?'✓':st.cls==='active'?s.icon:'○'}</div>
        <div class="step-label">${s.label}</div>
        <div class="step-sublabel">${st.sub}</div>
      </div>`;
    }).join('');

    const scoreHtml=p.puntaje_total!=null?`
      <div style="text-align:center">
        <div style="font-size:10px;font-weight:700;color:rgba(255,255,255,.6);text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px">Puntaje</div>
        <div style="font-size:28px;font-weight:800;color:#fff;line-height:1">${p.puntaje_total}</div>
        <div style="font-size:11px;color:rgba(255,255,255,.6)">/100</div>
      </div>`:`<div style="text-align:center"><div style="font-size:10px;font-weight:700;color:rgba(255,255,255,.6);text-transform:uppercase;letter-spacing:.5px">Estado</div><div style="margin-top:4px">${estadoBadge(p.estado)}</div></div>`;

    return`<div class="post-status-card">
      <div class="post-status-card-hero" style="background:${th.grad}">
        <div class="post-status-card-info">
          <div style="font-size:10px;font-weight:700;color:rgba(255,255,255,.55);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">${conc?conc.categoria:''} · ${conc?conc.titulo:'–'}</div>
          <div class="post-status-card-title" style="color:#fff">${p.titulo}</div>
          <div style="font-size:12px;color:rgba(255,255,255,.6);margin-top:3px">Enviado el ${fmtDate(p.enviado_en)} · ${fmtMoney(p.presupuesto)}</div>
        </div>
        ${scoreHtml}
      </div>
      <div style="height:5px;background:rgba(0,0,0,.07);overflow:hidden">
        <div style="height:100%;width:${pct}%;background:${p.estado==='evaluado'?'var(--green)':'var(--teal)'};transition:width .6s ease"></div>
      </div>
      <div class="post-status-card-steps">
        <div class="stepper">${stepHtml}</div>
        ${ev&&ev.comentario?`<div style="margin-top:12px;background:#f8f9fb;border-radius:10px;padding:12px 16px;border-left:3px solid var(--teal)"><div style="font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px">Comentario del evaluador</div><div style="font-size:13px;color:var(--t2);line-height:1.5">${ev.comentario}</div></div>`:''}
      </div>
    </div>`;
  }).join('');

  const emptyEstado=filteredMine.length===0?`<div class="empty-state" style="padding:40px"><div class="icon">🔍</div><p>No hay postulaciones en esta categoría.</p></div>`:'';

  return`
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
  <div>
    <div style="font-size:20px;font-weight:800">Estado de mis Postulaciones</div>
    <div style="font-size:13px;color:var(--t3);margin-top:2px">${mine.length} postulación${mine.length!==1?'es':''} registrada${mine.length!==1?'s':''}</div>
  </div>
  <button class="btn btn-primary btn-sm" onclick="navTo('concursos-post')">+ Postular a otro concurso</button>
</div>
${estadoFilterBar}
${emptyEstado}${cards}`;
}

// ══════════════════════════════════════
//  ENVIAR POSTULACIÓN
// ══════════════════════════════════════
function enviarPost(concursoId){
  const titulo=document.getElementById('np-titulo')?.value?.trim();
  const desc=document.getElementById('np-desc')?.value?.trim();
  const pres=parseInt(document.getElementById('np-presupuesto')?.value||0);
  const exp=document.getElementById('np-exp')?.value?.trim();
  const equipo=document.getElementById('np-equipo')?.value?.trim();
  if(!titulo||!desc||!pres||!exp||!equipo){toast('Completa todos los campos requeridos','warn');return;}
  const id='post_'+Date.now();
  const np={
    id,concurso_id:concursoId||'conc001',
    postulante_uid:_session.uid,postulante_nombre:_session.nombre,
    postulante_email:_session.email,postulante_org:_session.org,
    titulo,descripcion:desc,presupuesto:pres,experiencia:exp,equipo,
    estado:'pendiente',puntaje_total:null,enviado_en:Date.now(),evaluaciones:{}
  };
  _allPosts[id]=np;
  if(_db)_db.ref(`${DB_PATH}/postulaciones/${id}`).set(np);
  _concursoSeleccionado=null;
  toast('Postulación enviada exitosamente ✅');
  navTo('mi-postulacion');
}

// ══════════════════════════════════════
//  DETALLE MODAL
// ══════════════════════════════════════
function openDetalle(id){
  const p=_allPosts[id];if(!p)return;
  const isEval=_session?.rol==='evaluador';
  document.getElementById('modal-det-title').textContent=p.titulo;
  const ev=Object.values(p.evaluaciones||{})[0];
  document.getElementById('modal-det-body').innerHTML=`
    ${isEval?`<div class="alert alert-warn"><span>🔒</span> Evaluación ciega — identidad oculta.</div>`:`
    <div style="margin-bottom:16px">
      <div style="font-size:11px;font-weight:700;color:var(--t3);margin-bottom:4px">POSTULANTE</div>
      <div style="font-size:15px;font-weight:700">${p.postulante_nombre}</div>
      <div style="font-size:12px;color:var(--t4)">${p.postulante_email} · ${p.postulante_org}</div>
    </div>`}
    <div style="margin-bottom:14px">
      <div style="font-size:11px;font-weight:700;color:var(--t3);margin-bottom:4px">DESCRIPCIÓN</div>
      <div style="font-size:13px;color:var(--t2);line-height:1.6">${p.descripcion}</div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px">
      <div><div style="font-size:11px;font-weight:700;color:var(--t3);margin-bottom:3px">PRESUPUESTO</div><div style="font-size:14px;font-weight:700">${fmtMoney(p.presupuesto)}</div></div>
      <div><div style="font-size:11px;font-weight:700;color:var(--t3);margin-bottom:3px">ESTADO</div><div style="margin-top:2px">${estadoBadge(p.estado)}</div></div>
      <div><div style="font-size:11px;font-weight:700;color:var(--t3);margin-bottom:3px">EQUIPO</div><div style="font-size:13px;color:var(--t2)">${p.equipo}</div></div>
      <div><div style="font-size:11px;font-weight:700;color:var(--t3);margin-bottom:3px">EXPERIENCIA</div><div style="font-size:13px;color:var(--t2)">${p.experiencia}</div></div>
    </div>
    ${ev?`<div style="border-top:1px solid var(--border);padding-top:14px">
      <div style="font-size:11px;font-weight:700;color:var(--t3);margin-bottom:6px">EVALUACIÓN</div>
      <div style="font-size:28px;font-weight:800;color:${scoreColor(ev.total)}">${ev.total}<span style="font-size:13px;font-weight:400">/100</span></div>
      <div style="font-size:13px;color:var(--t2);margin-top:6px">${ev.comentario||''}</div>
    </div>`:''}`;
  document.getElementById('modal-det-footer').innerHTML=`
    <button class="btn btn-secondary btn-sm" onclick="closeModal('modal-detalle')">Cerrar</button>
    ${p.estado!=='evaluado'?`<button class="btn btn-primary btn-sm" onclick="closeModal('modal-detalle');openEval('${p.id}')">Evaluar</button>`:''}`;
  openModal('modal-detalle');
}

// ══════════════════════════════════════
//  EVAL MODAL
// ══════════════════════════════════════
function openEval(id){
  const p=_allPosts[id];if(!p)return;
  _evalTarget=id;
  const crit=(_settings?.criterios||SEED_SETTINGS.criterios);
  const prev=(p.evaluaciones||{})[_session.uid];
  const rows=crit.map((c,i)=>`
    <div class="criterion-row">
      <div class="criterion-name"><b>${c.nombre}</b></div>
      <input class="criterion-input" type="number" min="0" max="${c.peso}" id="crit-${i}" value="${prev?.puntajes?.['c'+i]||0}" oninput="updEvalTotal()">
      <span class="criterion-max">/ ${c.peso}</span>
      <span class="ai-sug-btn" id="ai-sug-${i}" style="display:none">✨ IA</span>
    </div>`).join('');

  document.getElementById('modal-eval-body').innerHTML=`
    <div class="alert alert-warn" style="margin-bottom:14px"><span>🔒</span> <b>Evaluación ciega</b> — la identidad del postulante no se muestra.</div>
    <div style="margin-bottom:12px"><b style="font-size:14px">${p.titulo}</b><div style="font-size:12px;color:var(--t4);margin-top:3px">${fmtDate(p.enviado_en)} · ${fmtMoney(p.presupuesto)}</div></div>
    <div style="font-size:13px;color:var(--t2);margin-bottom:16px;line-height:1.5">${p.descripcion}</div>
    <div style="font-size:11px;font-weight:700;color:var(--t3);margin-bottom:10px;text-transform:uppercase">Criterios de Evaluación</div>
    ${rows}
    <div style="display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--border);padding-top:12px;margin-top:4px">
      <span style="font-size:13px;color:var(--t3)">Puntaje Total:</span>
      <span style="font-size:28px;font-weight:800;color:var(--teal)" id="eval-tot">${prev?.total||0}</span>
    </div>
    <div class="field-group" style="margin-top:14px">
      <label>Comentario del Evaluador</label>
      <textarea id="eval-com" rows="3" placeholder="Fortalezas, debilidades, observaciones...">${prev?.comentario||''}</textarea>
    </div>
    <div id="ai-eval-panel"></div>`;
  openModal('modal-eval');
}

function updEvalTotal(){
  const crit=_settings?.criterios||SEED_SETTINGS.criterios;
  let tot=0;
  crit.forEach((_,i)=>{tot+=parseInt(document.getElementById('crit-'+i)?.value||0);});
  const el=document.getElementById('eval-tot');
  if(el){el.textContent=tot;el.style.color=scoreColor(tot);}
}

function guardarEvaluacion(){
  const crit=_settings?.criterios||SEED_SETTINGS.criterios;
  let tot=0;const puntajes={};
  crit.forEach((_,i)=>{const v=parseInt(document.getElementById('crit-'+i)?.value||0);puntajes['c'+i]=v;tot+=v;});
  const comentario=document.getElementById('eval-com')?.value||'';
  const p=_allPosts[_evalTarget];if(!p)return;
  const ev={uid:_session.uid,puntajes,comentario,total:tot,fecha:Date.now()};
  if(!p.evaluaciones)p.evaluaciones={};
  p.evaluaciones[_session.uid]=ev;
  p.estado='evaluado';p.puntaje_total=tot;
  if(_db){
    _db.ref(`${DB_PATH}/postulaciones/${_evalTarget}/evaluaciones/${_session.uid}`).set(ev);
    _db.ref(`${DB_PATH}/postulaciones/${_evalTarget}/estado`).set('evaluado');
    _db.ref(`${DB_PATH}/postulaciones/${_evalTarget}/puntaje_total`).set(tot);
  }
  closeModal('modal-eval');
  renderView(_activeNav);
  toast('Evaluación guardada ✅');
}

// ══════════════════════════════════════
//  AI CALLS
// ══════════════════════════════════════
async function _llmCall(messages){
  const key=_settings?.api_key||'';
  if(!key)return'⚠️ No hay API Key configurada. Ve a Configuración → API Key Gemini.';
  try{
    const contents=messages.map(m=>({
      role:m.role==='assistant'?'model':m.role,
      parts:[{text:m.content}]
    }));
    const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${key}`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({contents,generationConfig:{maxOutputTokens:1000}})
    });
    const j=await r.json();
    if(j.error)return'Error IA: '+j.error.message;
    return j.candidates?.[0]?.content?.parts?.[0]?.text||'Sin respuesta';
  }catch(e){return'Error de conexión: '+e.message;}
}

async function pedirSugerenciaIA(){
  const p=_allPosts[_evalTarget];if(!p)return;
  const crit=_settings?.criterios||SEED_SETTINGS.criterios;
  const panel=document.getElementById('ai-eval-panel');
  if(!panel)return;
  panel.innerHTML=`<div class="ai-panel"><h4>✨ Analizando con IA…</h4><div style="color:#15803d;font-style:italic;font-size:13px">Generando sugerencias de puntaje…</div></div>`;

  const prompt=`Eres evaluador experto en innovación tecnológica. Analiza el proyecto y sugiere puntajes para cada criterio. Responde SOLO en JSON: {"c0":N,"c1":N,"c2":N,"c3":N,"justificacion":"texto"}.

Proyecto: ${p.titulo}
Descripción: ${p.descripcion}
Equipo: ${p.equipo}
Experiencia: ${p.experiencia}
Presupuesto: ${fmtMoney(p.presupuesto)}

Criterios (máximo en paréntesis):
${crit.map((c,i)=>`c${i}: ${c.nombre} (max ${c.peso})`).join('\n')}`;

  const res=await _llmCall([{role:'user',content:prompt}]);
  try{
    const json=res.match(/\{[\s\S]*\}/)?.[0];
    const obj=JSON.parse(json||res);
    crit.forEach((_,i)=>{
      const v=obj['c'+i];
      if(v!==undefined){
        const sug=document.getElementById('ai-sug-'+i);
        if(sug){
          sug.style.display='inline';
          sug.textContent=`✨ Aceptar ${v}`;
          sug.onclick=()=>{
            const inp=document.getElementById('crit-'+i);
            if(inp){inp.value=v;updEvalTotal();}
            sug.style.display='none';
          };
        }
      }
    });
    panel.innerHTML=`<div class="ai-panel"><h4>✨ Justificación IA</h4><div class="ai-result">${obj.justificacion||'Puntuaciones sugeridas disponibles arriba.'}</div></div>`;
  }catch(e){
    panel.innerHTML=`<div class="ai-panel"><h4>✨ Análisis IA</h4><div class="ai-result">${res}</div></div>`;
  }
}

async function abrirIARanking(){
  openModal('modal-ia-rank');
  const body=document.getElementById('modal-ia-body');
  body.innerHTML=`<div style="color:#15803d;font-style:italic;font-size:13px">Analizando proyectos con IA…</div>`;
  const evaluated=posts().filter(p=>p.puntaje_total!=null).sort((a,b)=>b.puntaje_total-a.puntaje_total);
  if(!evaluated.length){body.innerHTML=`<div class="alert alert-warn">No hay postulaciones evaluadas aún.</div>`;return;}
  const params=_settings?.ranking_params||SEED_SETTINGS.ranking_params;
  const ctx=_settings?.ranking_ctx||SEED_SETTINGS.ranking_ctx;
  const list=evaluated.map((p,i)=>`${i+1}. "${p.titulo}" (${p.postulante_org}) — Puntaje: ${p.puntaje_total}/100\n   ${p.descripcion}`).join('\n\n');

  const prompt=`Eres experto en evaluación de proyectos de innovación. Analiza los proyectos evaluados y genera un ranking con justificación basado en los parámetros.

CONTEXTO: ${ctx}
PARÁMETROS: ${params}

PROYECTOS (por puntaje):
${list}

Entrega:
1. Ranking final recomendado con justificación
2. Análisis de los 3 mejores proyectos
3. Conclusión y recomendación para el jurado`;

  const res=await _llmCall([{role:'user',content:prompt}]);
  body.innerHTML=`<div class="ai-panel" style="margin:0"><h4>✨ Análisis IA – Ranking de Proyectos</h4><div class="ai-result">${res.replace(/\n/g,'<br>')}</div></div>`;
}

// ══════════════════════════════════════
//  UTILS
// ══════════════════════════════════════
function openModal(id){document.getElementById(id).classList.add('open');}
function closeModal(id){document.getElementById(id).classList.remove('open');}

function toast(msg,type='success'){
  let el=document.getElementById('_toast');
  if(!el){
    el=document.createElement('div');el.id='_toast';
    Object.assign(el.style,{position:'fixed',bottom:'24px',right:'24px',padding:'12px 20px',borderRadius:'10px',fontWeight:'600',fontSize:'13px',zIndex:'99999',boxShadow:'0 4px 20px rgba(0,0,0,.2)',transition:'opacity .3s'});
    document.body.appendChild(el);
  }
  const colors={success:{bg:'#e8f5e9',border:'#a5d6a7',color:'#1b5e20'},warn:{bg:'#fff8e1',border:'#ffe082',color:'#6d4c00'},error:{bg:'#ffebee',border:'#ef9a9a',color:'#c62828'}};
  const c=colors[type]||colors.success;
  Object.assign(el.style,{background:c.bg,border:`1px solid ${c.border}`,color:c.color,opacity:'1'});
  el.textContent=msg;
  clearTimeout(el._t);
  el._t=setTimeout(()=>{el.style.opacity='0';},3000);
}

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Redirigiendo...</title>
<script>
(function(){
  var seg = location.pathname.split('/').filter(Boolean)[0];
  if (seg) {
    location.replace('/?c=' + encodeURIComponent(seg));
  } else {
    location.replace('/');
  }
})();
</script>
</head>
<body></body>
</html>

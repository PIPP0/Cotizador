<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>No disponible</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#F2F1EE;--fg:#1D1D1B;--muted:#5F5B55}
  *{box-sizing:border-box;margin:0}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:var(--bg);color:var(--fg);font-family:'Montserrat',Arial,sans-serif;text-align:center}
  .brand{font-size:18px;font-weight:600;letter-spacing:6px;text-transform:uppercase}
  .sub{font-size:13px;letter-spacing:6px;text-transform:uppercase;color:var(--muted);margin-top:4px}
  p.msg{margin-top:32px;font-size:16px;line-height:1.5;color:var(--muted)}
</style>
</head>
<body>
<main>
  <div class="brand">Cristián Donoso</div>
  <div class="sub">Atelier</div>
  <p class="msg">Esta página no está disponible por ahora.</p>
</main>
</body>
</html>

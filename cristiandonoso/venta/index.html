    ${piece?`<div class="cfg-price"><div class="cfg-top"><span>Precio de la pieza</span><b>${price(k,piece.precio)}</b></div><p class="cfg-sum">${esc(piece.acabado)} · ${esc(piece.m)} · ${UB[piece.ub]}</p></div><p class="cfg-plazo">${piece.ub==='B'?'Pieza fabricada en blanco: se aplica el acabado que elija el cliente.':'Se entrega de inmediato.'} <button class="cfg-link" data-act="cmode" data-m="pedido">Ver opciones a pedido</button></p>`:''}
    ${hidden?`<p class="d-hidden">${hidden} pieza${hidden>1?'s':''} con información interna no se muestra${hidden>1?'n':''} en tu perfil.</p>`:''}`;
  } else {
    const med = `<p class="d-label">1 · Medida <span>ancho × profundidad × alto (cm)</span></p><div class="d-variants">${p.vars.map((x,i)=>`<button class="d-var" data-act="cvar" data-i="${i}" aria-pressed="${!c.custom&&i===c.vi}">${esc(x.m)}${x.desc?'<small>Descontinuado</small>':''}</button>`).join('')}${permiteMedida(p)&&R.std?`<button class="d-var cfg-mp" data-act="ccustom" aria-pressed="${c.custom}">Medida a pedido<small>${c.custom?'Editando':'Cambiar una o más medidas'}</small></button>`:''}</div>
      ${c.custom&&R.std?`<div class="cfg-dims">${DIMS.map((d,i)=>`<label class="cfg-dim ${R.changed.includes(i)?'on':''}"><span>${title(d)}</span><input id="cfg-${k}-${i}" data-in="dim" data-d="${i}" inputmode="numeric" autocomplete="off" value="${esc(c.dims[i])}"><small>${R.changed.includes(i)?'Lista: '+R.std[i]:'Medida de lista'}</small></label>`).join('')}</div>
      <div class="cfg-status ${R.special?'warn':R.changed.length?'info':''}" role="status">${R.special?`<b>Mueble especial.</b> Cambian ${R.changed.length} medidas (${R.changed.map(i=>DIMS[i]).join(', ')}). Requiere cotización interna; el precio es referencial.`:R.changed.length?`Cambia el ${DIMS[R.changed[0]]}: se suma ${R.mPct}% por ser ${p.cat.toLowerCase()}.`:'Escribe la nueva medida. Si cambia una, se suma un porcentaje; si cambian dos o más, es un mueble especial.'}</div>`:''}`;
    const gb=grupoById(baseGrupo(p));
    const ac = permiteAcabado(p) ? `<p class="d-label">2 · Acabado <span>el grupo define el precio; el tono, la fabricación</span></p><div class="cfg-groups">${RULES.grupos.map(g=>{ const d=g.pct-gb.pct; return `<button class="cfg-g" data-act="cgrupo" data-g="${g.id}" aria-pressed="${c.grupo===g.id}"><b>${esc(g.nombre)}</b><span>${d===0?'Precio de lista':(d>0?'+':'')+d+'%'}</span></button>`; }).join('')}</div>
      <div class="cfg-tonos">${['',...R.g.tonos].map(t=>`<button class="cfg-t" data-act="ctono" data-t="${esc(t)}" aria-pressed="${(c.tono||'')===t}">${t?`<span class="sw" style="background:${colorOf(t)}"></span>${esc(t)}`:'Por definir'}</button>`).join('')}</div>`
      : `<p class="d-label">2 · Acabado</p><p class="d-note">${esc(p.base)}. Este mueble no permite cambiar el acabado.</p>`;
    const resumen = `${esc(cleanM(R.va.m))}${c.custom&&R.changed.length?' → '+esc(c.dims.join(' × ')):''} · ${permiteAcabado(p)?esc(R.g.nombre)+' · '+(c.tono?esc(c.tono):'tono por definir'):esc(p.base)}`;
    const card = can(k,'precios')
      ? `<div class="cfg-price ${R.special?'ref':''} ${c.brk?'open':''}"><div class="cfg-top"><span>${R.special?'Precio referencial':'Precio final'}</span><b class="${bump?'bump':''}">${fmt(R.total)}</b></div><p class="cfg-sum">${resumen}${R.va.inc?'<br>'+esc(R.va.inc):''}</p>${R.lines.length>1?`<button class="cfg-brk-btn" data-act="cbrk" aria-expanded="${c.brk}">${c.brk?'Ocultar desglose':'Ver desglose'}</button>${c.brk?`<div class="cfg-break">${R.lines.map(([l,v],i)=>`<div><span>${esc(l)}</span><span>${i===0?'':v>=0?'+ ':'− '}${fmt(Math.abs(v))}</span></div>`).join('')}<div class="tot"><span>${R.special?'Referencial':'Total'}</span><span>${fmt(R.total)}</span></div></div>`:''}`:''}</div>`
      : `<div class="cfg-price"><div class="cfg-top"><span>Precio</span><b>Consultar</b></div><p class="cfg-sum">${resumen}<br>Tu perfil no muestra precios.</p></div>`;
    const enBlanco = !c.custom && p.pcs.some(x=>x.ub==='B' && x.m.replace(/\s/g,'')===cleanM(R.va.m).replace(/\s/g,''));
    const plazo = `<p class="cfg-plazo">${R.special?'Plazo según la cotización interna.':enBlanco?'<b>Hay una pieza en blanco de esta medida.</b> Solo falta aplicar el acabado, así que se entrega antes. <button class="cfg-link" data-act="cmode" data-m="pieza">Ver pieza</button>':'Se fabrica a pedido en 15 a 90 días corridos.'}</p>`;
    body = med + ac + card + plazo;
  }
  return `<div class="d">
   <div><div class="d-media tile">${art(p, acab, st.fi)}</div>${thumbs}</div>
   <div class="d-info">
     <p class="d-eyebrow">${esc(p.cat)}</p>
     <h2 class="d-title">${esc(p.nombre)}</h2>
     <p class="d-desc">${esc(p.desc)}</p>
     <div class="d-badges">${badge(dk)}${p.vars.some(x=>x.desc)?'<span class="bd bd-desc">Tiene medidas descontinuadas</span>':''}</div>
     <div class="d-actions"><button class="d-cta" data-act="pres">${ICON_PLAY} Mostrar al cliente</button><button class="d-sec-btn" data-act="quote">${ICON_DOC} Cotización</button>${can(k,'editar')?`<label class="d-sec-btn">${ICON_CAM} ${p.fotos.length?'Agregar foto':'Subir foto'}<input type="file" accept="image/*" class="sr" data-in="fotoq" data-id="${p.id}"></label>`:''}</div>
     ${seg}${body}
   </div></div>`;
}

function userMenu(k){
  const u=me(k), st=ST[k]; if(!u) return '';
  return `<div class="um"><button class="um-btn" data-act="menu" aria-expanded="${st.menu}" aria-label="Mi cuenta"><span class="um-av">${ini(u.n)}</span><span class="um-name">${esc(u.n)}</span></button>${st.menu?`<div class="um-dd"><div><b>${esc(u.n)}</b><p>${esc(u.e)}</p></div><div><span class="rol ${u.rol}">${u.rol==='admin'?'Administrador':'Ejecutivo'}</span></div><p>${u.rol==='admin'?'Acceso completo al catálogo, al panel y al equipo.':'Permisos: '+(PERMS.filter(([id])=>u.perms[id]).map(x=>x[1].toLowerCase()).join(', ')||'solo ver el catálogo')+'.'}</p><button data-act="logout">Cerrar sesión</button></div>`:''}</div>`;
}
function login(k, brand, sub){
  const st=ST[k];
  const quick = TEAM.filter(u=>u.id==='u1'||u.id==='u2');
  return `<div class="lg"><form class="lg-card" data-act="login" data-k="${k}">
    ${brand}
    <p class="lg-help" style="margin:0">${sub}</p>
    ${st.lgErr?`<div class="lg-err" role="alert">${st.lgErr}</div>`:''}
    <div><label for="lg-mail-${k}">Correo</label><input id="lg-mail-${k}" type="email" placeholder="tu correo del equipo" autocomplete="off"></div>
    <button class="lg-btn" type="submit">Recibir enlace de acceso</button>
    <div class="lg-or">Acceso rápido del prototipo</div>
    <div class="lg-quick">${quick.map(u=>`<button type="button" class="lg-q" data-act="quick" data-u="${u.id}"><span class="um-av">${ini(u.n)}</span><b>${esc(u.n)}</b><span class="rol ${u.rol}">${u.rol==='admin'?'Administrador':'Ejecutivo'}</span></button>`).join('')}</div>
    <p class="lg-help">En la plataforma real llega un enlace al correo y solo entran las personas que la administradora haya invitado. Prueba también con <b>marcela@ejemplo.cl</b> (acceso suspendido).</p>
  </form></div>`;
}
const navPanel = (k, cls) => hasPanel(k);

/* ---------- Panel ---------- */
function panel(k){
  const st = ST[k]; const tabs = tabsFor(k);
  if(!tabs.length) return `<div class="pn"><div class="empty"><b>Tu perfil no tiene acceso al panel</b>Pide permisos a la administradora.</div></div>`;
  if(!st.tab || !tabs.find(t=>t[0]===st.tab)) st.tab = tabs[0][0];
  const u=me(k);
  const head = `<div class="pn-head"><div><h1>Panel</h1><p>${isAdmin(k)?'Administra el catálogo, la disponibilidad y el equipo.':'Hola '+esc(u.n)+'. Tienes acceso a: '+tabs.map(t=>t[1].toLowerCase()).join(', ')+'.'}</p></div>${st.tab==='muebles'?'<button class="pn-btn pri" data-act="new">+ Nuevo mueble</button>':st.tab==='equipo'?'<button class="pn-btn pri" data-act="invite">+ Invitar persona</button>':''}</div>
   <div class="pn-tabs" role="tablist">${tabs.map(([id,l])=>`<button class="pn-tab" role="tab" data-act="tab" data-t="${id}" aria-selected="${st.tab===id}">${l}${id==='muebles'?' ('+PRODUCTS.length+')':id==='equipo'?' ('+TEAM.length+')':''}</button>`).join('')}</div>`;
  let body='';
  if(st.tab==='muebles'){
    const pq = norm(st.pq); const rows = PRODUCTS.filter(p=>!pq||hay(p).includes(pq));
    body = `<div class="pn-tools"><input id="pq-${k}" data-in="pq" placeholder="Buscar en el catálogo" value="${esc(st.pq)}"></div>
    <div class="pn-list">${rows.map(p=>`<div class="pn-row"><div class="tile">${art(p)}</div><div><b>${esc(p.nombre)}</b><span>${esc(p.cat)} · ${p.fotos.length?p.fotos.length+' foto'+(p.fotos.length>1?'s':''):'sin fotos'}</span></div><div class="hide-s num"><span>${p.vars.length} medida${p.vars.length>1?'s':''} · desde</span><br>${fmt(minP(p))}</div><div class="hide-s">${badge(dispOf(p))}</div><button class="pn-btn" data-act="edit" data-id="${p.id}">Editar</button></div>`).join('')}</div>`;
  } else if(st.tab==='excel'){ body = importView(k); }
  else if(st.tab==='equipo'){
    const act=TEAM.filter(t=>t.activo).length, adm=TEAM.filter(t=>t.rol==='admin').length;
    body = `<div style="margin-top:20px" class="tm-sum"><div><b>${act}</b><span>Personas con acceso</span></div><div><b>${TEAM.length-act}</b><span>Accesos suspendidos</span></div><div><b>${adm}</b><span>Administrador${adm>1?'es':''}</span></div></div>
    <div class="tm"><div class="tm-h"><span>Persona</span><span>Rol</span><span>Permisos</span><span>Acceso hasta</span><span>Activo</span><span></span></div>
    ${TEAM.map(t=>`<div class="tm-r ${t.activo?'':'off'}"><div class="tm-who"><span class="um-av">${ini(t.n)}</span><div><b>${esc(t.n)}${t.id===u.id?' (tú)':''}</b><span>${esc(t.e)} · ${esc(t.ultimo)}</span></div></div><div class="c-rol"><span class="rol ${t.rol}">${t.rol==='admin'?'Administrador':'Ejecutivo'}</span></div><div class="tm-perm">${t.rol==='admin'?'Acceso completo':(PERMS.filter(([id])=>t.perms[id]).map(x=>x[1]).join(' · ')||'Solo ver catálogo')}</div><div class="tm-meta">${t.hasta?new Date(t.hasta+'T12:00').toLocaleDateString('es-CL',{day:'numeric',month:'short',year:'numeric'}):'Sin límite'}</div><div><label class="tg" title="${t.activo?'Suspender acceso':'Reactivar acceso'}"><input type="checkbox" data-in="activo" data-u="${t.id}" ${t.activo?'checked':''} ${t.id===u.id?'disabled':''} aria-label="Acceso de ${esc(t.n)}"><span></span></label></div><div><button class="pn-btn" data-act="editu" data-u="${t.id}">Editar</button></div></div>`).join('')}</div>`;
  } else if(st.tab==='reglas'){
    const slug = c => norm(c).replace(/[^a-z0-9]+/g,'-');
    body = `<div class="callout" style="margin-top:20px"><b>Reglas de precio del Atelier.</b> El +7% de Efraín y la regla de mueble especial son las que usan hoy. Los porcentajes por tipo de mueble son de ejemplo y se reemplazan con su tabla.</div>
    <h3 class="rg-h">Grupos de acabado</h3><p class="rg-p">El grupo define el precio. El tono se elige para fabricar y no cambia el valor.</p>
    <div class="rg-list">${RULES.grupos.map((g,i)=>`<div class="rg-g"><div class="f"><label for="rg-n-${i}">Grupo</label><input id="rg-n-${i}" value="${esc(g.nombre)}"></div><div class="f"><label for="rg-p-${i}">Recargo</label><div class="rg-in"><input id="rg-p-${i}" inputmode="numeric" value="${g.pct}">%</div></div><div class="f" style="grid-column:1/-1"><label for="rg-t-${i}">Tonos (separados por coma)</label><textarea id="rg-t-${i}" rows="2">${esc(g.tonos.join(', '))}</textarea></div></div>`).join('')}</div>
    <h3 class="rg-h">Recargo por cambiar una medida</h3><p class="rg-p">Se aplica cuando cambia solo una medida: ancho, profundidad o alto.</p>
    <div class="rg-cats">${allCats().map(c=>`<label class="rg-c" for="rg-m-${slug(c)}"><span>${c}</span><span class="rg-in"><input id="rg-m-${slug(c)}" class="rg-m" data-cat="${esc(c)}" inputmode="numeric" value="${RULES.medida[c]??0}">%</span></label>`).join('')}</div>
    <h3 class="rg-h">Mueble especial</h3><div class="f" style="max-width:360px"><label for="rg-esp">Requiere cotización interna desde</label><select id="rg-esp"><option value="2" ${RULES.especialDesde===2?'selected':''}>2 medidas cambiadas</option><option value="3" ${RULES.especialDesde===3?'selected':''}>3 medidas cambiadas</option></select></div>
    <h3 class="rg-h">Cómo se combinan los recargos</h3><p class="rg-p">Ejemplo con un mueble de $10.000.000, acabado Efraín (+7%) y una medida a pedido (+10%).</p>
    <div class="rolpick" style="max-width:760px"><label><input type="radio" name="rg-comb" value="suma" ${RULES.combinar==='suma'?'checked':''}><b>Se suman</b><span>+7% +10% = +17% → ${fmt(11700000)}</span></label><label><input type="radio" name="rg-comb" value="compuesto" ${RULES.combinar!=='suma'?'checked':''}><b>Uno sobre otro</b><span>×1,07 y luego ×1,10 → ${fmt(11770000)}</span></label></div>
    <h3 class="rg-h">Redondeo del precio final</h3>
    <div class="rolpick" style="max-width:760px"><label><input type="radio" name="rg-red" value="no" ${RULES.redondeo!=='mil'?'checked':''}><b>Sin redondeo</b><span>Ej.: $14.498.500</span></label><label><input type="radio" name="rg-red" value="mil" ${RULES.redondeo==='mil'?'checked':''}><b>Al millar</b><span>Ej.: $14.499.000</span></label></div>
    <div style="display:flex;justify-content:flex-end;margin-top:24px"><button class="pn-btn pri" data-act="saverules">Guardar reglas</button></div>`;
  } else if(st.tab==='actividad'){
    body = `<p style="color:var(--muted);margin:20px 0 12px">Cada cambio queda registrado: quién lo hizo y cuándo.</p><div class="act">${LOG.map(l=>`<div><span>${esc(l.t)}</span><span style="color:var(--fg)"><b>${esc(l.who)}</b> · ${esc(l.what)}</span></div>`).join('')}</div>`;
  }
  return `<div class="pn">${head}${body}</div>${st.edit?editor(k):''}${st.inv?userModal(k):''}`;
}
function editor(k){
  const st=ST[k]; const p = st.edit;
  return `<div class="modal" data-act="closeedit-bg"><div class="modal-box ${ANIM.has('modal')?'anim':''}" data-ks="modal" role="dialog" aria-label="Editar mueble">
   <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px"><h2 style="margin:0;font-size:24px">${p._new?'Nuevo mueble':'Editar mueble'}</h2><button class="x" data-act="closeedit" aria-label="Cerrar">×</button></div>
   <div class="f"><label>Fotos</label>
     <div class="drop" data-drop="edit"><b>Arrastra fotos aquí</b><p>JPG o PNG. Se optimizan solas para que carguen rápido.</p><label class="pn-btn">Elegir fotos<input type="file" accept="image/*" multiple class="sr" data-in="fotos-edit"></label></div>
     ${p.fotos.length?`<div class="phs">${p.fotos.map((f,i)=>`<div class="ph"><img src="${f}" alt="Foto ${i+1}">${i===0?'<span class="ph-b">Principal</span>':`<button class="ph-s" data-act="mainf" data-i="${i}">Hacer principal</button>`}<button class="ph-x" data-act="delf" data-i="${i}" aria-label="Quitar foto">×</button></div>`).join('')}</div>`:''}
   </div>
   <div class="f"><label for="e-nombre">Nombre</label><input id="e-nombre" value="${esc(p.nombre)}"></div>
   <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
     <div class="f"><label for="e-cat">Categoría</label><select id="e-cat">${allCats().map(c=>`<option ${c===p.cat?'selected':''}>${c}</option>`).join('')}</select></div>
     <div class="f"><label for="e-base">Acabado base</label><input id="e-base" value="${esc(p.base)}"></div>
   </div>
   <div class="f"><label for="e-desc">Descripción</label><textarea id="e-desc" rows="2">${esc(p.desc)}</textarea></div>
   <div class="f"><label>Personalización</label><div class="perm"><div><b>Permite medidas a pedido</b><span>El vendedor puede cambiar ancho, profundidad o alto.</span></div><label class="tg"><input type="checkbox" id="e-med" ${p.medidaPedido!==false?'checked':''} aria-label="Permite medidas a pedido"><span></span></label></div><div class="perm"><div><b>Permite cambiar acabado</b><span>Muestra los grupos de acabado y sus tonos.</span></div><label class="tg"><input type="checkbox" id="e-acb" ${p.cambiaAcabado!==false?'checked':''} aria-label="Permite cambiar acabado"><span></span></label></div></div>
   <div class="f"><label>Medidas y precio de lista</label>${p.vars.map((x,i)=>`<div class="f-row"><input data-v="m" data-i="${i}" value="${esc(x.m)}" aria-label="Medida"><input data-v="precio" data-i="${i}" inputmode="numeric" value="${x.precio??''}" placeholder="Por cargar" aria-label="Precio"><button class="x" data-act="delv" data-i="${i}" aria-label="Quitar medida">×</button></div>`).join('')}<button class="pn-btn" data-act="addv" style="align-self:flex-start">+ Agregar medida</button></div>
   <div class="f"><label>Piezas físicas y ubicación</label>${p.pcs.map((x,i)=>`<div class="f-row2"><input data-pc="acabado" data-i="${i}" value="${esc(x.acabado)}" aria-label="Acabado"><input data-pc="m" data-i="${i}" value="${esc(x.m)}" aria-label="Medida"><select data-pc="ub" data-i="${i}" aria-label="Ubicación">${Object.keys(UB).map(u=>`<option value="${u}" ${u===x.ub?'selected':''}>${UB[u]}</option>`).join('')}</select></div>`).join('')}<button class="pn-btn" data-act="addpc" style="align-self:flex-start">+ Agregar pieza</button></div>
   <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:8px"><button class="pn-btn" data-act="closeedit">Cancelar</button><button class="pn-btn pri" data-act="save">Guardar cambios</button></div>
  </div></div>`;
}
function userModal(k){
  const st=ST[k], t=st.inv, self = t.id===me(k).id, isA = t.rol==='admin';
  return `<div class="modal" data-act="closeinv-bg"><div class="modal-box ${ANIM.has('modal')?'anim':''}" data-ks="modal" role="dialog" aria-label="${t._new?'Invitar persona':'Editar persona'}">
   <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px"><h2 style="margin:0;font-size:24px">${t._new?'Invitar persona':'Editar acceso'}</h2><button class="x" data-act="closeinv" aria-label="Cerrar">×</button></div>
   <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div class="f"><label for="u-n">Nombre</label><input id="u-n" value="${esc(t.n)}" placeholder="Nombre y apellido"></div><div class="f"><label for="u-e">Correo</label><input id="u-e" type="email" value="${esc(t.e)}" placeholder="correo@empresa.cl" ${t._new?'':'readonly'}></div></div>
   <div class="f"><label>Rol</label><div class="rolpick">
     <label><input type="radio" name="u-rol" value="ejecutivo" data-in="urol" ${!isA?'checked':''} ${self?'disabled':''}><b>Ejecutivo</b><span>Ve el catálogo con los permisos que elijas.</span></label>
     <label><input type="radio" name="u-rol" value="admin" data-in="urol" ${isA?'checked':''} ${self?'disabled':''}><b>Administrador</b><span>Acceso completo, incluido el equipo.</span></label>
   </div></div>
   <div class="f"><label>Permisos</label>${isA?'<div class="callout">Los administradores tienen todos los permisos.</div>':PERMS.map(([id,l,d])=>`<div class="perm"><div><b>${l}</b><span>${d}</span></div><label class="tg"><input type="checkbox" data-in="uperm" data-p="${id}" ${t.perms[id]?'checked':''} aria-label="${l}"><span></span></label></div>`).join('')}</div>
   <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:end">
     <div class="f"><label for="u-h">Acceso hasta (opcional)</label><input id="u-h" type="date" value="${t.hasta||''}"></div>
     <div class="f"><label>Estado</label><div class="perm" style="border:none;padding:6px 0"><span style="font-size:15px;color:var(--fg)">${t.activo?'Activo':'Suspendido'}</span><label class="tg"><input type="checkbox" data-in="uact" ${t.activo?'checked':''} ${self?'disabled':''} aria-label="Acceso activo"><span></span></label></div></div>

function compress(file){
  return new Promise(res=>{
    const rd=new FileReader();
    rd.onload=()=>{ const img=new Image(); img.onload=()=>{ const max=1600, sc=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc); c.getContext('2d').drawImage(img,0,0,c.width,c.height); const url=c.toDataURL('image/jpeg',.82); res({url,antes:file.size,despues:Math.round((url.length-23)*0.75)}); }; img.onerror=()=>res(null); img.src=rd.result; };
    rd.onerror=()=>res(null); rd.readAsDataURL(file);
  });
}
async function addPhotos(k, files, target){
  const imgs=[...files].filter(f=>f.type.startsWith('image/')); if(!imgs.length){ toast('Elige archivos de imagen (JPG o PNG)'); return; }
  let antes=0, despues=0, n=0;
  for(const f of imgs){ const r=await compress(f); if(!r) continue; antes+=r.antes; despues+=r.despues; n++; target.fotos.push(r.url); }
  render();
  if(n) toast(`${n} foto${n>1?'s':''} optimizada${n>1?'s':''}: ${kb(antes)} → ${kb(despues)}`); else toast('No pudimos leer esa imagen');
  return n;
}

function parseWB(k, wb, name){
  const st=ST[k];
  const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});
  const hi=rows.findIndex(r=>r.some(c=>norm(c).startsWith('descripcion'))&&r.some(c=>norm(c)==='pvp'));
  if(hi<0){ st.imp={estado:'error',nombre:name,msg:'No encontramos las columnas DESCRIPCIÓN y PVP. Revisa que sea la planilla de inventario.'}; return render(); }
  const H=rows[hi].map(c=>norm(c).replace(/\s+/g,' '));
  const col=(...n)=>H.findIndex(h=>n.some(x=>h===x||h.startsWith(x)));
  const C={grupo:col('grupo'),fam:col('familia'),desc:col('descripcion'),l:col('largo'),a:col('ancho'),h:col('alto'),acab:col('acabado'),asig:col('asignado'),pvp:col('pvp'),B:H.indexOf('b'),BPT:H.indexOf('bpt'),SH:H.indexOf('sh'),SE:H.findIndex(h=>h==='s.e'||h==='se'),CS:H.indexOf('cs'),CD:H.indexOf('cd'),FDL:H.indexOf('fdl')};
  const num=x=>+(String(x).replace(/[^\d]/g,''))||0;
  const cell=(r,i)=>i>-1?String(r[i]).trim():'';
  const out=[];
  for(let i=hi+1;i<rows.length;i++){
    const r=rows[i], d=cell(r,C.desc); if(!d||norm(d).startsWith('descripcion')) continue;
    const fdl=C.FDL>-1&&num(r[C.FDL])>0;
    let ub=null,qty=0; for(const u of ['SH','BPT','B','CS','CD','SE']){ if(C[u]>-1&&num(r[C[u]])>0){ ub=u; qty=num(r[C[u]]); break; } }
    const L=cell(r,C.l),A=cell(r,C.a),Hh=cell(r,C.h);
    const m = L&&A&&Hh ? `${L} × ${A} × ${Hh}` : Hh ? 'Alto '+Hh.replace(/[^\d]/g,'') : 'Medida estándar';
    let asig=cell(r,C.asig); if(['cd','cs','b','bpt','sh'].includes(norm(asig))) asig='';
    const grupo=cell(r,C.grupo), fam=cell(r,C.fam)||d;
    out.push({fila:i+1,grupo,fam,desc:d,acab:cell(r,C.acab)||'Sin acabado',asig,pvp:num(r[C.pvp]),m,ub,qty:qty||1,fdl,key:norm(grupo)+'|'+norm(fam)});
  }
  const sig=a=>a.map(x=>[norm(x.acabado),norm(x.m),x.ub,x.precio,norm(x.asig)].join('/')).sort().join(';');
  const groups={}; out.forEach(o=>{ (groups[o.key]=groups[o.key]||{key:o.key,rows:[]}).rows.push(o); });
  Object.values(groups).forEach(g=>{ g.prod=PRODUCTS.find(p=>p.key===g.key)||null; g.pcs=g.rows.filter(o=>!o.fdl&&o.ub).flatMap(o=>Array.from({length:o.qty},()=>pz(o.acab,o.m,o.ub,o.pvp,o.asig))); g.estado = g.prod ? (sig(g.prod.pcs)===sig(g.pcs)?'igual':'cambia') : 'nuevo'; });
  st.imp={estado:'listo',nombre:name,rows:out,groups:Object.values(groups)}; render();
}
function applyImport(k){
  const st=ST[k], G=st.imp.groups; let upd=0, nue=0;

}

async function xlsQuote(k){
  const st=ST[k], p=PRODUCTS.find(x=>x.id===st.sel); if(!p) return;
  const c=cfgOf(k,p), R=calc(p,c), piece = c.modo==='pieza' ? p.pcs[c.pi] : null;
  const unit = piece ? piece.precio : R.total;
  const med = piece ? piece.m : (c.custom&&R.changed.length? c.dims.join(' × ') : cleanM(R.va.m));
  const acab = piece ? piece.acabado : (permiteAcabado(p) ? R.g.nombre+' · '+(c.tono||'tono por definir') : p.base);
  const hoy = new Date().toLocaleDateString('es-CL',{day:'numeric',month:'long',year:'numeric'});
  const plazo = piece?(piece.ub==='B'?'Según aplicación del acabado':'Inmediata'):'15 a 90 días corridos';
  try{ await loadXLSX(); }catch(e){ toast('No pudimos preparar el Excel. Revisa tu conexión.'); return; }
  const n = unit==null ? 'Por cargar' : unit;
  const aoa=[['PRESUPUESTO','','','','','','N° 4221 (ejemplo)'],['Cliente','[Nombre del cliente]'],['Fecha',hoy],['Preparado por',(me(k)||{}).n||'Equipo comercial'],[],
    ['Cantidad','Ubicación','Producto','Medidas (cm)','Acabado','Precio unitario','Precio final'],
    [1,'Opción A',p.nombre,med,acab,n,n],
    ...(R.special&&!piece?[['','','Mueble especial: precio sujeto a cotización interna']]:[]),[],
    ['','','','','','Total',n],['','','','','','Anticipo 50%',unit==null?'—':unit/2],['','','','','','Saldo contra entrega',unit==null?'—':unit/2],[],
    ['Forma de pago','50% anticipo y 50% contra entrega'],['Plazo de entrega',plazo],['Validez','30 días corridos desde su emisión'],
    ['Observaciones','Las terminaciones se hacen a mano sobre maderas nobles, por lo que cada acabado es referencial y varía de un mueble a otro.']];
  const ws=XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols']=[{wch:16},{wch:12},{wch:34},{wch:22},{wch:30},{wch:20},{wch:18}];
  Object.keys(ws).forEach(a=>{ const cell=ws[a]; if(a[0]!=='!' && typeof cell.v==='number' && cell.v>1000){ cell.z='"$"#,##0'; } });
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Presupuesto');
  const name='Cotizacion-Atelier-'+norm(p.nombre).replace(/[^a-z0-9]+/g,'-')+'.xlsx';
  try{ XLSX.writeFile(wb,name); toast('Excel descargado: '+name); }catch(e){ toast('Este navegador no permite descargar el archivo aquí'); }
}

let TOUR = null;
const TOUR_STEPS = [
  {t:'Busque como habla el cliente', d:'Escriba parte del nombre, la categoría o un acabado. Los resultados aparecen mientras escribe.', hl:'.pb-s'},
  {t:'Abra la ficha', d:'Fotos, medidas, disponibilidad y precio en una sola vista.', hl:'.d-media'},
  {t:'Configure lo que pide el cliente', d:'El grupo de acabado define el precio: Efraín suma 7%. El tono queda listo para fabricar.', hl:'.cfg-price'},
  {t:'Medida a pedido', d:'Si cambia una medida se suma su porcentaje. Si cambian dos o más, se marca como mueble especial.', hl:'.cfg-status'},
  {t:'La cotización, lista en un toque', d:'En PDF con la foto del mueble y su marca, o en Excel para seguir editándola. Es la tercera etapa.', hl:'.q-paper'},
  {t:'Muéstrelo al cliente', d:'Pantalla completa en la tablet, sin información interna. Se desliza para ver otros muebles.', hl:'.pres-stage'}
];
const wait = ms => new Promise(r=>setTimeout(r,ms));
function tourCard(){ return ''; }
let tourEl=null, ringEl=null, tourShown=-1, ringRaf=null;
function tourInner(n){
  const st=TOUR_STEPS[n], last=n===TOUR_STEPS.length-1;
  return `<div class="tour-top"><span class="tour-n">${n+1} de ${TOUR_STEPS.length}</span><span class="tour-dots" aria-hidden="true">${TOUR_STEPS.map((_,i)=>`<i class="${i===n?'on':i<n?'done':''}"></i>`).join('')}</span></div><b>${st.t}</b><p>${st.d}</p><div class="tour-b"><button data-act="tourend">Salir</button><button class="pri" data-act="tournext">${last?'Terminar y probar yo':'Siguiente →'}</button></div>`;
}
function tourUI(){
  if(TOUR===null){
    if(tourEl){ const el=tourEl; el.classList.add('hide'); tourEl=null; tourShown=-1; setTimeout(()=>el.remove(),450); }
    if(ringEl){ const r=ringEl; r.classList.remove('on'); ringEl=null; setTimeout(()=>r.remove(),350); }
    cancelAnimationFrame(ringRaf); return;
  }
  if(!tourEl){
    tourEl=document.createElement('div'); tourEl.className='tour hide'; tourEl.setAttribute('role','dialog'); tourEl.setAttribute('aria-label','Recorrido guiado');
    tourEl.innerHTML=`<div class="tour-c">${tourInner(TOUR)}</div>`; document.body.appendChild(tourEl); tourShown=TOUR;
    requestAnimationFrame(()=>requestAnimationFrame(()=>tourEl&&tourEl.classList.remove('hide')));
    ringEl=document.createElement('div'); ringEl.className='tour-ring'; document.body.appendChild(ringEl);
    ringLoop();
  } else if(tourShown!==TOUR){
    const c=tourEl.querySelector('.tour-c'), n=TOUR; tourShown=n;
    if(reduced()){ c.innerHTML=tourInner(n); }
    else { c.classList.add('swap'); setTimeout(()=>{ if(!tourEl) return; c.innerHTML=tourInner(n); c.classList.remove('swap'); },200); }
  }
}
function ringLoop(){
  if(!ringEl || TOUR===null) return;
  const el=document.querySelector(TOUR_STEPS[TOUR].hl);
  if(el){ const r=el.getBoundingClientRect(), p=8;
    if(r.width>0){ ringEl.style.transform=`translate(${Math.round(r.left-p)}px,${Math.round(r.top-p)}px)`; ringEl.style.width=Math.round(r.width+p*2)+'px'; ringEl.style.height=Math.round(r.height+p*2)+'px'; ringEl.classList.add('on'); }
  } else ringEl.classList.remove('on');
  ringRaf=requestAnimationFrame(ringLoop);
}
async function tourGo(n){
  const st=ST.b; TOUR=n;
  if(n===0){
    route='b'; st.uid='u1'; st.view='catalogo'; st.sel=null; st.cfg=null; st.pres=false; st.quote=false; st.q=''; st.cat='Todas'; st.disp='todas'; try{ history.replaceState(null,'','#b'); }catch(e){} render(); window.scrollTo(0,0); highlight(); await wait(500);
    for(const ch of 'cannes'){ await wait(140); if(TOUR!==0) return; st.q+=ch; render(); }
  }
  if(n===1){ st.q='cannes'; st.scrollY=window.scrollY; st.sel='cannes'; st.cfg=null; st.vi=0; st.fi=0; st.msel=true; render(); window.scrollTo({top:0,behavior:reduced()?'auto':'smooth'}); await wait(350); }
  if(n===2){ const p=PRODUCTS.find(x=>x.id==='cannes'); const c=cfgOf('b',p); c.modo='pedido'; c.grupo='ef'; c.tono='Efraín azul'; c.custom=false; render(); }
  if(n===3){ const p=PRODUCTS.find(x=>x.id==='cannes'); const c=cfgOf('b',p); c.custom=true; c.dims=parts(p.vars[c.vi].m).slice(); c.dims[0]='260'; render(); }
  if(n===4){ st.quote=true; render(); }
  if(n===5){ st.quote=false; st.pres=true; ANIM.add('pres'); render(); }
  render(); highlight();
}
function highlight(){
  tourUI(); if(TOUR===null) return;
  setTimeout(()=>{ const el=document.querySelector(TOUR_STEPS[TOUR].hl); if(!el || el.closest('.q-box,.pres')) return;
    const r=el.getBoundingClientRect(); if(r.top<80 || r.bottom>innerHeight-220) el.scrollIntoView({behavior: reduced()?'auto':'smooth', block:'center'}); },60);
}
function tourEnd(final){
  TOUR=null; const st=ST.b; st.pres=false; st.quote=false;
  if(final){ st.sel=null; st.q=''; }
  render(); highlight(); if(final) toast('Listo. Ahora pruébelo usted: busque un mueble que conozca.');
}

/* ======================= Render: conserva scroll y foco ======================= */
function render(){
  const a = document.activeElement; const fid = a && a.id; let pos=null; try{ pos = a && a.selectionStart; }catch(e){}
  const keep = {}; document.querySelectorAll('[data-ks]').forEach(el=>keep[el.dataset.ks]={t:el.scrollTop,l:el.scrollLeft});
  const y = window.scrollY;
  const app = document.getElementById('app');
  let html='';
  if(route==='home') html = home();
  else html = ({a:protoA,b:protoB,c:protoC,d:protoD})[route]() + (ST[route].quote?quoteView(route):'') + (me(route)?'':`<button class="back-pill" data-act="home">← Inicio</button>`) + `<span class="demo-flag">DEMO</span>`;
  app.innerHTML = html;
  document.body.className = 'r-'+route;
  document.body.style.overflow = (route!=='home' && (ST[route].pres || (route==='a'&&ST.a.sel) || ST[route].edit || ST[route].inv || ST[route].quote)) || S_START ? 'hidden' : '';
  document.title = route==='home' ? 'Catálogo Atelier · Demo' : ({a:'Atelier',b:'Colección',c:'Galería',d:'Mostrador'})[route] + ' · Prototipo';
  document.querySelectorAll('[data-ks]').forEach(el=>{ const s=keep[el.dataset.ks]; if(s){ el.scrollTop=s.t; el.scrollLeft=s.l; } });
  if(Math.abs(window.scrollY - y) > 1) window.scrollTo(0,y);
  if(fid){ const el=document.getElementById(fid); if(el && el.focus){ el.focus({preventScroll:true}); try{ if(pos!=null) el.setSelectionRange(pos,pos);}catch(e){} } }
  ANIM.clear();
}

/* ======================= Eventos ======================= */
document.addEventListener('click', e=>{

    case 'view': vt(()=>{ st.view=t.dataset.v; st.sel=null; st.edit=null; st.inv=null; st.pres=false; window.scrollTo(0,0); }); return;
    case 'cat': st.cat=t.dataset.c; break;
    case 'crumbcat': vt(()=>{ st.cat=t.dataset.c; st.sel=null; }); return;
    case 'disp': if(t.tagName==='INPUT') st.disp=t.dataset.d; else st.disp = (st.disp===t.dataset.d && k!=='c') ? 'todas' : t.dataset.d; break;
    case 'open': return openP(k, t.dataset.id);
    case 'close': return closeP(k);
    case 'mback': vt(()=>{ st.msel=false; window.scrollTo(0, st.scrollY||0); }); return;
    case 'var': st.vi=+t.dataset.i; break;
    case 'cmode': { const p=PRODUCTS.find(x=>x.id===st.sel); const c=cfgOf(k,p); c.modo=t.dataset.m; if(c.modo==='pieza'&&c.pi<0){ const vp=visiblePcs(k,p); c.pi=vp[0]?vp[0][1]:-1; } if(c.modo==='pieza'){ const pb=p.pcs.findIndex(x=>x.ub==='B'&&x.m.replace(/\s/g,'')===cleanM(p.vars[Math.min(c.vi,p.vars.length-1)].m).replace(/\s/g,'')); if(t.closest('.cfg-plazo')&&pb>-1) c.pi=pb; } break; }

    case 'ctono': st.cfg.tono=t.dataset.t||null; break;

      document.querySelectorAll('.rg-m').forEach(el=>RULES.medida[el.dataset.cat]=+el.value.replace(/[^\d.]/g,'')||0);

    case 'invite': st.inv={_new:true,id:'u'+Date.now(),n:'',e:'',rol:'ejecutivo',activo:true,hasta:'',perms:{precios:true,internos:false,editar:false,excel:false},ultimo:'Invitación pendiente'}; ANIM.add('modal'); break;
    case 'editu': st.inv=JSON.parse(JSON.stringify(TEAM.find(u=>u.id===t.dataset.u))); ANIM.add('modal'); break;

function loginAs(k, uid){
  const st=ST[k], u=TEAM.find(x=>x.id===uid);
  vt(()=>{ st.uid=u.id; st.lgErr=''; st.view='catalogo'; u.ultimo=now(); });
  toast(`Hola ${u.n}. Entraste como ${u.rol==='admin'?'administrador':'ejecutivo'}`);
}
function openP(k,id){
  const st=ST[k];
  const apply = () => { st.sel=id; st.vi=0; st.pc=-1; st.fi=0; st.pa=null; st.msel=true; st.cfg=null; };
  if(k==='a'){ apply(); ANIM.add('sheet'); render(); return; }
  if(k==='d' && window.innerWidth>820){ apply(); render(); return; }
  st.scrollY = window.scrollY;
  vt(()=>{ apply(); window.scrollTo(0,0); });
}
function closeP(k){
  const st=ST[k];
  if(k==='a'){

  }
  vt(()=>{ st.sel=null; window.scrollTo(0, st.scrollY||0); });
}
function saveUser(k){
  const st=ST[k], u=st.inv;
  if(!u.n.trim() || !/^\S+@\S+\.\S+$/.test(u.e)){ toast('Escribe nombre y un correo válido'); return; }
  if(u._new && TEAM.some(x=>norm(x.e)===norm(u.e))){ toast('Ese correo ya tiene acceso'); return; }
  if(u._new){ delete u._new; TEAM.push(u); addLog(k,`Invitó a ${u.n} como ${u.rol==='admin'?'administrador':'ejecutivo'}`); toast('Invitación enviada a '+u.e); }
  else { const i=TEAM.findIndex(x=>x.id===u.id); TEAM[i]=u; addLog(k,'Actualizó el acceso de '+u.n); toast('Cambios guardados'); }
  st.inv=null; render();
}
document.addEventListener('submit', e=>{
  const f=e.target.closest('[data-act="login"]'); if(!f) return; e.preventDefault();
  const k=f.dataset.k, st=ST[k], mail=norm((f.querySelector('input[type=email]')||{}).value);
  const u=TEAM.find(x=>norm(x.e)===mail);
  if(!mail){ st.lgErr='Escribe tu correo.'; }
  else if(!u){ st.lgErr='Este correo no tiene acceso. Pide a la administradora que te invite.'; }
  else if(!u.activo){ st.lgErr='Tu acceso está suspendido. Habla con la administradora para reactivarlo.'; }
  else if(u.hasta && new Date(u.hasta+'T23:59') < new Date()){ st.lgErr='Tu acceso venció. Pide a la administradora que lo extienda.'; }
  else { loginAs(k,u.id); return; }
  render();
});

  else if(t.dataset.in==='excel' && t.files[0]){ readExcel(k, t.files[0]); }
  else if(t.dataset.in==='presprice'){ st.presPrice=t.checked; render(); }
  else if(t.dataset.in==='activo'){ const u=TEAM.find(x=>x.id===t.dataset.u); u.activo=t.checked; addLog(k,(u.activo?'Reactivó':'Suspendió')+' el acceso de '+u.n); toast(u.activo?'Acceso reactivado':'Acceso suspendido'); render(); }
  else if(t.dataset.in==='urol'){ syncUser(k); st.inv.rol=t.value; render(); }
  else if(t.dataset.in==='uact'){ syncUser(k); st.inv.activo=t.checked; render(); }
});
['dragover','dragenter'].forEach(ev=>document.addEventListener(ev, e=>{ const d=e.target.closest('[data-drop]'); if(!d) return; e.preventDefault(); d.classList.add('over'); }));
document.addEventListener('dragleave', e=>{ const d=e.target.closest('[data-drop]'); if(d && !d.contains(e.relatedTarget)) d.classList.remove('over'); });
document.addEventListener('drop', e=>{
  const d=e.target.closest('[data-drop]'); if(!d) return; e.preventDefault(); d.classList.remove('over');
  const k=route, st=ST[k], files=e.dataTransfer.files; if(!files.length) return;
  if(d.dataset.drop==='edit'){ syncEditor(k); addPhotos(k, files, st.edit); }
  if(d.dataset.drop==='excel'){ readExcel(k, files[0]); }
});
let sx=null;
document.addEventListener('pointerdown', e=>{ if(e.target.closest('[data-swipe]') && !e.target.closest('button')) sx=e.clientX; });
document.addEventListener('pointerup', e=>{ if(sx==null) return; const dx=e.clientX-sx; sx=null; if(Math.abs(dx)>60 && route!=='home' && ST[route].pres) presMove(route, dx<0?1:-1); });
document.addEventListener('keydown', e=>{
  if(route==='home') return; const k=route, st=ST[k]; const inField = /INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||'');
  if(st.pres){ if(e.key==='ArrowRight') presMove(k,1); if(e.key==='ArrowLeft') presMove(k,-1); if(e.key==='Escape'){ st.pres=false; render(); } return; }
  if(e.key==='/' && !inField){ const q=document.getElementById('q-'+k); if(q){ e.preventDefault(); q.focus(); } }
  if(e.key==='Escape' && st.quote){ st.quote=false; render(); return; }
  if(e.key==='Escape'){ if(st.menu){ st.menu=false; render(); } else if(st.edit){ st.edit=null; render(); } else if(st.inv){ st.inv=null; render(); } else if(st.drawer){ st.drawer=false; render(); } else if(st.sel && k!=='d'){ closeP(k); } }
  if(k==='d' && st.view==='catalogo' && (e.key==='ArrowDown'||e.key==='ArrowUp') && !st.edit && !inField){
    const r=list(st); if(!r.length) return; e.preventDefault();
    let i=r.findIndex(p=>p.id===st.sel); i = e.key==='ArrowDown'? Math.min(r.length-1,i+1) : Math.max(0,i-1);
    st.sel=r[i].id; st.vi=0; st.pc=-1; st.fi=0; render();
    const el=document.querySelector('.pd-r[aria-selected="true"]'); if(el) el.scrollIntoView({block:'nearest'});
  }
});
let rz; window.addEventListener('resize', ()=>{ clearTimeout(rz); rz=setTimeout(()=>{ if(route!=='home') render(); },150); });
window.addEventListener('hashchange', ()=>{ readHash(); render(); });
readHash(); render();

</script>
</body>
</html>
